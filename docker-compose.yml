services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: mirrors.aliyun.com
    image: the-explorer:production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "file:/app/storage/the-explorer-prod.db"
      OPENAI_API_KEY: ""
    ports:
      - "3003:3001"
    volumes:
      - app_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_storage:
    name: the_explorer_storage
