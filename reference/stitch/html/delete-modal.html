</div>

<div class="absolute top-0 left-1/2 -translate-x-1/2 w-4 h-4 rounded-full bg-neutral-600"></div>
</div>

<div class="h-4 w-24 bg-white/10 rounded mb-4"></div>
<div class="h-8 w-64 bg-white/10 rounded"></div>
</div>
</div>
</div>
</div>

<div class="p-8 flex flex-col items-center text-center">

<div class="w-16 h-16 rounded-full bg-error-container/20 flex items-center justify-center mb-6 border border-error/20">
<span class="material-symbols-outlined text-error text-3xl" data-icon="delete_forever" style="font-variation-settings: &quot;FILL&quot; 0;">delete_forever</span>
</div>

                </p>

                        取消

<div class="w-64 h-32 bg-error/5 blur-3xl rounded-full"></div>
